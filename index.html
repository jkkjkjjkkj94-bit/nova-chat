<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOVA Chat</title><style>*{box-sizing:border-box}body{margin:0;font:15px system-ui;background:#eaf1ed;color:#20352a}button,input{font:inherit;padding:12px;border-radius:10px;border:1px solid #ddd}button{background:#09895b;color:white;border:0;cursor:pointer}header{padding:18px;background:#078657;color:white;font-weight:700}.wrap{max-width:1100px;margin:auto;background:white;min-height:100dvh}.auth{max-width:380px;margin:12vh auto;padding:20px}.auth input{display:block;width:100%;margin:12px 0}.layout{display:grid;grid-template-columns:300px 1fr;height:100dvh}.side{border-right:1px solid #ddd;overflow:auto}.side input{margin:10px;width:calc(100% - 20px)}.contact{display:block;width:100%;text-align:left;background:white;color:#20352a;border-bottom:1px solid #eee;border-radius:0}.chat{display:flex;flex-direction:column;background:#f4f8f5}.messages{flex:1;overflow:auto;padding:20px}.bubble{padding:10px 14px;background:white;border-radius:14px;margin:9px 0;max-width:80%;width:max-content;overflow-wrap:anywhere}.mine{margin-left:auto;background:#d4f6df}.composer{display:flex;gap:8px;padding:12px;background:white}.composer input{flex:1;min-width:0}.hidden{display:none!important}#status{color:#b33333}@media(max-width:650px){.layout{display:block}.side{height:100%}.chat{display:none;height:100%}.layout.open .side{display:none}.layout.open .chat{display:flex}}</style><div class="wrap"><section id="auth" class="auth"><h1>NOVA Chat</h1><p>Mensagens em tempo real</p><input id="email" type="email" placeholder="E-mail"><input id="pass" type="password" placeholder="Senha (6+ caracteres)"><button id="signin">Entrar</button> <button id="signup">Criar conta</button><p id="status"></p></section><div id="layout" class="layout hidden"><aside class="side"><header>NOVA Chat <button id="logout" style="float:right;background:#18694d">Sair</button></header><input id="search" placeholder="Buscar pessoas"><div id="people"></div></aside><main class="chat"><header><button id="back" style="background:#176c4c">‹</button> <span id="name">Conversa</span></header><div class="messages" id="messages"></div><form id="composer" class="composer"><input id="msg" maxlength="4000" placeholder="Mensagem..." required><button>Enviar</button></form></main></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.min.js"></script><script>
const db=supabase.createClient('https://dthqzavxqoejqszsijqd.supabase.co','sb_publishable_rN1cirhfpFyxghxKx-gLTA_Ca0TP_Rn'),$=id=>document.getElementById(id);let me=null,peer=null,channel=null,users=[];const status=s=>$('status').textContent=s;
async function refresh(){const {data:{user}}=await db.auth.getUser();me=user;$('auth').classList.toggle('hidden',!!me);$('layout').classList.toggle('hidden',!me);if(me){await db.from('nova_chat_profiles').upsert({id:me.id,display_name:me.email.split('@')[0]},{onConflict:'id',ignoreDuplicates:true});await contacts()}else{peer=null;$('layout').classList.remove('open');if(channel){await db.removeChannel(channel);channel=null}}}
$('signin').onclick=async()=>{const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('pass').value});status(error?.message||'Entrando...');if(!error)await refresh()};
$('signup').onclick=async()=>{const {error}=await db.auth.signUp({email:$('email').value.trim(),password:$('pass').value});status(error?.message||'Conta criada. Confirme seu e-mail se solicitado.')};
$('logout').onclick=()=>db.auth.signOut();db.auth.onAuthStateChange(()=>setTimeout(refresh,0));refresh();
async function contacts(){const {data,error}=await db.from('nova_chat_profiles').select('id,display_name').order('display_name').limit(100);if(error)return status(error.message);users=(data||[]).filter(x=>x.id!==me.id);render()}
function render(){const q=$('search').value.toLowerCase();$('people').replaceChildren();users.filter(x=>x.display_name.toLowerCase().includes(q)).forEach(x=>{const b=document.createElement('button');b.className='contact';b.textContent=x.display_name;b.onclick=()=>openChat(x);$('people').append(b)})}
$('search').oninput=render;$('back').onclick=()=>$('layout').classList.remove('open');
async function openChat(x){peer=x;$('name').textContent=x.display_name;$('layout').classList.add('open');if(channel)await db.removeChannel(channel);await load();channel=db.channel('nova-'+me.id+'-'+x.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'nova_chat_messages'},({new:m})=>{if(peer&&((m.sender_id===me.id&&m.receiver_id===peer.id)||(m.sender_id===peer.id&&m.receiver_id===me.id)))load()}).subscribe()}
async function load(){if(!peer)return;const id=peer.id;const {data,error}=await db.from('nova_chat_messages').select('id,sender_id,body,created_at').or('and(sender_id.eq.'+me.id+',receiver_id.eq.'+id+'),and(sender_id.eq.'+id+',receiver_id.eq.'+me.id+')').order('created_at',{ascending:false}).limit(100);if(error)return alert(error.message);$('messages').replaceChildren();(data||[]).reverse().forEach(m=>{const d=document.createElement('div');d.className='bubble'+(m.sender_id===me.id?' mine':'');d.textContent=m.body;const t=document.createElement('small');t.style.display='block';t.textContent=new Date(m.created_at).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});d.append(t);$('messages').append(d)});$('messages').scrollTop=$('messages').scrollHeight}
$('composer').onsubmit=async e=>{e.preventDefault();if(!peer)return;const body=$('msg').value.trim();if(!body)return;const id=peer.id;const {error}=await db.from('nova_chat_messages').insert({sender_id:me.id,receiver_id:id,body});if(error)return alert(error.message);$('msg').value='';await load()};
</script></html>
